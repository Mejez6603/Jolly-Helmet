<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Jolly Helmet - data flow diagram</title>
<style>
  @page { size: 1900px 1260px; margin: 0 }
  /* Jolly Helmet theme: the mascot's orange with its navy outline, cream paper (same navy / cream / amber as the Online Monitor page) */
  :root { --p1:#0c2340; --p2:#14325c; --p3:#f59e0b; --p4:#efc473; --p5:#fff0cf; --p6:#fff7e0; --ink:#0c2340; --sub:#47587a; --orange1:#ffc060; --orange2:#f08a0c; }
  * { box-sizing: border-box }
  html, body { margin: 0; background: #fff; font-family: 'Segoe UI', Arial, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact }
  #c { position: relative; width: 1900px; height: 1260px; background: #fff; overflow: hidden }
  #frame { position: absolute; inset: 14px; border: 3px solid var(--p1); border-radius: 30px; background: linear-gradient(180deg, #ffffff, #fffaec) }
  svg#wires { position: absolute; left: 0; top: 0; width: 1900px; height: 1260px; pointer-events: none }

  .pill { position: absolute; top: 34px; width: 320px; height: 58px; border-radius: 999px; color: var(--p1); font-weight: 800; font-size: 26px; letter-spacing: 1.5px; border: 3px solid var(--p1);
          display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, var(--orange1), var(--orange2)); box-shadow: 0 6px 14px rgba(12,35,64,.28); text-shadow: 0 1px 0 rgba(255,255,255,.35) }

  .card { position: absolute; border: 2px solid var(--p4); border-radius: 16px; background: linear-gradient(180deg, #ffffff, var(--p5)); box-shadow: 0 4px 10px rgba(12,35,64,.14);
          display: flex; align-items: center; gap: 12px; padding: 8px 12px }
  .card.v { flex-direction: column; justify-content: center; text-align: center; gap: 6px; padding: 8px 10px }
  .card.hero { border: 4px solid var(--p1); background: linear-gradient(180deg, #ffffff, #ffe6b3); box-shadow: 0 8px 18px rgba(12,35,64,.28) }
  .ic { flex: 0 0 42px; width: 42px; height: 42px; border-radius: 12px; background: var(--p5); border: 1.5px solid var(--p4); display: flex; align-items: center; justify-content: center }
  .card.v .ic { flex: 0 0 38px; width: 38px; height: 38px }
  .ic svg { width: 26px; height: 26px; fill: none; stroke: var(--p2); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
  .tx { min-width: 0 }
  .tt { font-weight: 800; font-size: 15.5px; line-height: 1.15; color: var(--ink) }
  .ss { font-size: 12px; line-height: 1.28; color: var(--sub); margin-top: 3px }
  .card.hero .tt { font-size: 19px; letter-spacing: .3px }
  .card.hero .ss { font-size: 12.5px }
  .card.hero img { width: 66px; height: auto; display: block }

  .mod { position: absolute; border: 2px solid var(--p4); border-radius: 16px; background: linear-gradient(180deg, #ffffff, var(--p5)); box-shadow: 0 4px 10px rgba(12,35,64,.14); padding: 10px 12px }
  .mod .mh { display: flex; align-items: center; gap: 10px; margin-bottom: 8px }
  .mod .inner { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--p4); border-radius: 12px; padding: 7px 10px; margin-top: 8px }

  .lbl { position: absolute; transform: translate(-50%, -50%); background: #fff; border: 1.5px solid var(--p3); color: var(--p1); font-size: 11px; font-weight: 600; line-height: 1.2;
         padding: 2px 7px; border-radius: 10px; text-align: center; white-space: nowrap }
  .lbl.dark { background: var(--p1); border-color: var(--p1); color: #fff; font-size: 11.5px; letter-spacing: .3px }

  #fb { position: absolute; left: 44px; top: 1062px; width: 1812px; height: 150px; border: 3px solid var(--p2); border-radius: 24px; background: var(--p6) }
  #fbh { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); height: 50px; padding: 0 30px; border-radius: 999px; color: var(--p1); font-weight: 800; font-size: 21px; letter-spacing: 1px; border: 3px solid var(--p1);
         display: flex; align-items: center; gap: 12px; background: linear-gradient(180deg, var(--orange1), var(--orange2)); box-shadow: 0 6px 14px rgba(12,35,64,.28); white-space: nowrap; text-shadow: 0 1px 0 rgba(255,255,255,.35) }
  #fbh svg { width: 24px; height: 24px; fill: none; stroke: var(--p1); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round }
  #fb .card { position: absolute; top: 40px; height: 92px; width: 430px }
  .foot { position: absolute; right: 54px; top: 1224px; font-size: 12px; color: #6f7a92 }
</style></head>
<body>
<div id="c">
  <div id="frame"></div>
  <svg id="wires" viewBox="0 0 1900 1260" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14325c"/></marker>
    </defs>
  </svg>
  <div class="foot">Jolly Helmet · MEJEZ STUDIO · data flow diagram · 2026-11-07 · target design (Box 1, 2 and 3 built like Box 3)</div>
</div>

<script>
/* ---------- small icon set (24 x 24, stroke only) ---------- */
const IC = {
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
  wrench: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/>',
  form: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/>',
  coins: '<ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v4c0 1.7 2.7 3 6 3s6-1.3 6-3V7"/><path d="M15 10.5c3 .3 6 1.4 6 3v3.5c0 1.7-2.7 3-6 3-1.8 0-3.4-.4-4.5-1"/>',
  sensor: '<path d="M5 13a7 7 0 0 1 14 0"/><path d="M8 13a4 4 0 0 1 8 0"/><circle cx="12" cy="13" r="1.5"/><path d="M12 15v6"/>',
  chip: '<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>',
  db: '<ellipse cx="12" cy="5.5" rx="7" ry="3"/><path d="M5 5.5v13c0 1.7 3.1 3 7 3s7-1.3 7-3v-13M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
  server: '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  cloud: '<path d="M7 19a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 10a4.5 4.5 0 0 1-.5 9z"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.5 3 3.5 15 0 18M12 3c-3.5 3-3.5 15 0 18"/>',
  uv: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  flame: '<path d="M12 3c1 3.500 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/>',
  bolt: '<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',
  valve: '<path d="M3 9l9 4.500L3 18zM21 9l-9 4.500 9 4.500z"/><path d="M12 13.500V6M9 6h6"/>',
  helmet: '<path d="M3 16a9 9 0 0 1 18 0v2H3z"/><path d="M3 16h18M12 7v9"/>',
  screen: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  file: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  folder: '<path d="M3 6h7l2 2h9v11H3z"/>',
  chart: '<path d="M5 20V10M12 20V4M19 20v-8"/>',
  bell: '<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/>',
  warn: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  qr: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v7M14 20h3"/>',
  loop: '<path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/>',
  bug: '<path d="M8 8a4 4 0 0 1 8 0v8a4 4 0 0 1-8 0zM3 10h5M16 10h5M3 16h5M16 16h5M12 8v12"/>',
  gauge: '<path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/>',
  dash: '<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'
};
const ico = n => `<div class="ic"><svg viewBox="0 0 24 24">${IC[n]}</svg></div>`;
const c = document.getElementById('c');
const esc = s => s;

/* ---------- cards ---------- */
function card(o) {
  const d = document.createElement('div');
  d.className = 'card' + (o.v ? ' v' : '') + (o.hero ? ' hero' : '');
  d.style.cssText = `left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px`;
  const lead = o.img ? `<img src="${o.img}" alt="">` : ico(o.icon);
  d.innerHTML = `${lead}<div class="tx"><div class="tt">${o.t}</div><div class="ss">${o.s}</div></div>`;
  (o.parent || c).appendChild(d); return d;
}
function pill(txt, left) { const d = document.createElement('div'); d.className = 'pill'; d.style.left = left + 'px'; d.textContent = txt; c.appendChild(d); }
pill('INPUT', 64); pill('PROCESS', 790); pill('OUTPUT', 1518);

/* ---------- INPUT ---------- */
card({ x: 44, y: 130, w: 360, h: 96, icon: 'user', t: 'Customer', s: 'touch screen, coins, the helmet put in the box' });

const mod = document.createElement('div'); mod.className = 'mod'; mod.style.cssText = 'left:44px;top:242px;width:360px;height:234px';
mod.innerHTML = `<div class="mh">${ico('chip')}<div class="tt">Box input devices</div></div>
  <div class="inner">${ico('coins')}<div class="tx"><div class="tt" style="font-size:14.5px">Coin acceptor</div><div class="ss">coin pulses: the main controller books every accepted coin</div></div></div>
  <div class="inner">${ico('sensor')}<div class="tx"><div class="tt" style="font-size:14.5px">Sensors</div><div class="ss">helmet (ultrasonic) and the doors: enclosure, panel, back, side</div></div></div>`;
c.appendChild(mod);

card({ x: 44, y: 500, w: 360, h: 104, icon: 'wrench', t: 'Owner / Technician', s: 'phone or laptop on Wi-Fi JollyHelmet-Local: settings, rules, maintenance, backup' });
card({ x: 44, y: 620, w: 360, h: 96, icon: 'form', t: 'Team (ENTRY board)', s: 'types the previous customers (history.json)' });

/* ---------- PROCESS: at the box ---------- */
card({ x: 470, y: 200, w: 260, h: 210, v: true, hero: true, img: 'logo.png', t: 'JOLLY HELMET BOX SYSTEM',
  s: 'Box 1 · Box 2 · Box 3 main controllers (ESP32-S3)<br>the touch display shows the steps; the coins give the time (coin rate in Settings): welcome, coins, mode, cleaning, drying' });
card({ x: 820, y: 130, w: 250, h: 84, icon: 'uv', t: 'Cleaning', s: 'UV tubes + mist nozzles' });
card({ x: 820, y: 228, w: 250, h: 84, icon: 'flame', t: 'Drying', s: 'heater + fan (auto-dry at the end)' });
card({ x: 820, y: 326, w: 250, h: 112, icon: 'valve', t: 'Refilling Station', s: 'ESP32-WROOM: 3 water-level sensors, 3 valves, one valve at a time, EMPTY first, then LOW' });
card({ x: 1180, y: 226, w: 250, h: 150, icon: 'bolt', t: 'Box outputs', s: 'Relay controller (UV, mist, heater, fan, door locks) · TFT display + buzzer · Refilling Station valves' });

/* ---------- PROCESS: servers and databases ---------- */
card({ x: 470, y: 560, w: 190, h: 134, v: true, icon: 'server', t: 'Local Server (Offline)', s: 'ESP32-S3, Wi-Fi JollyHelmet-Local: Control Center, session log, totals, settings' });
card({ x: 743, y: 560, w: 190, h: 134, v: true, icon: 'globe', t: 'Online Server', s: 'ESP32-S3, listens only (boxes, Refilling Station, Local Server): snapshot, statistics, alerts' });
card({ x: 1016, y: 560, w: 180, h: 134, v: true, icon: 'cloud', t: 'Blynk Cloud', s: 'the online database: private V0 (live data), public V0 (box steps), V5 (nicknames)' });
card({ x: 1279, y: 560, w: 171, h: 134, v: true, icon: 'screen', t: 'Website', s: 'on Vercel: Monitor, Alerts, Reports, customer page. The browser reads Blynk itself' });
card({ x: 470, y: 790, w: 190, h: 118, v: true, icon: 'db', t: 'Local Database', s: 'settings (flash), session log + totals (FFat)' });
card({ x: 743, y: 790, w: 190, h: 118, v: true, icon: 'folder', t: 'Backup and history', s: 'CSV log, history.json, day viewer, restore' });

/* ---------- OUTPUT ---------- */
const OUT = [
  [130, 'helmet', 'Cleaned and dried helmet', 'UV and mist cleaning, then heater and fan drying'],
  [214, 'screen', 'Box screen and beeps', 'step, time left, coins; the OUT OF ORDER screen'],
  [298, 'drop', 'Main container refilled', 'level EMPTY, LOW, MID, HIGH or MAX'],
  [440, 'list', 'Session record', 'date, time, box, Finished or Cancelled, coins, minutes'],
  [524, 'dash', 'Control Center', 'Dashboard, Box 1-3 pages, Refilling Station page, Settings'],
  [666, 'gauge', 'Online Monitor', 'boxes drawn as machines, level dials, network map'],
  [750, 'bell', 'Alerts', 'coloured by priority, sounds, push to the Blynk app'],
  [834, 'chart', 'Reports', 'revenue and customers per day, busiest hours, what each box earns'],
  [918, 'qr', 'Customer status page', 'FREE / IN USE / OUT OF ORDER per box, from the QR sticker']
];
OUT.forEach(o => card({ x: 1500, y: o[0], w: 356, h: 72, icon: o[1], t: o[2], s: o[3] }));

/* ---------- FEEDBACK AND IMPROVEMENT ---------- */
const fb = document.createElement('div'); fb.id = 'fb';
fb.innerHTML = `<div id="fbh"><svg viewBox="0 0 24 24">${IC.loop}</svg>FEEDBACK AND IMPROVEMENT</div>`;
c.appendChild(fb);
const F = [
  [14, 'warn', 'Alerts and faults', 'box OUT OF ORDER, board not active, door opened during a run, container low'],
  [456, 'drop', 'Refill problems', 'no level rise in time = FAILED, retry every 60 s; station silent for 15 s = box offers drying only'],
  [898, 'chart', 'Reports and rules', 'revenue, customers and busiest hours: the owner changes the coin rate and the most coins'],
  [1340, 'bug', 'Crash reports and updates', 'last 3 crash reports in Settings, then fixes and firmware updates (re-flash)']
];
F.forEach(f => card({ parent: fb, x: f[0], y: 40, w: 440, h: 92, icon: f[1], t: f[2], s: f[3] }));
fb.querySelectorAll('.card').forEach((d, i) => { d.style.left = F[i][0] + 'px'; d.style.top = '40px'; d.style.width = '440px'; d.style.height = '92px'; });

/* ---------- wires ---------- */
const svg = document.getElementById('wires');
function wire(pts, o) {
  o = o || {};
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', 'M' + pts.map(q => q.join(',')).join(' L'));
  p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#14325c'); p.setAttribute('stroke-width', '3');
  p.setAttribute('stroke-linejoin', 'round'); p.setAttribute('stroke-linecap', 'round');
  if (o.dash) p.setAttribute('stroke-dasharray', '9 7');
  if (o.end) p.setAttribute('marker-end', 'url(#ah)');
  if (o.start) p.setAttribute('marker-start', 'url(#ah)');
  svg.appendChild(p);
}
function label(txt, x, y, dark) { const d = document.createElement('div'); d.className = 'lbl' + (dark ? ' dark' : ''); d.style.left = x + 'px'; d.style.top = y + 'px'; d.innerHTML = txt; c.appendChild(d); }

// input -> box system
wire([[404, 178], [437, 178], [437, 255], [470, 255]], { end: 1 });
wire([[404, 359], [470, 359]], { end: 1 });
// owner / team -> local server
wire([[404, 552], [437, 552], [437, 627], [470, 627]], { end: 1 });
wire([[404, 668], [437, 668], [437, 627]]);
// box system -> cleaning / drying
wire([[730, 305], [775, 305]]); wire([[775, 172], [775, 305]]);
wire([[775, 172], [820, 172]], { end: 1 }); wire([[775, 270], [820, 270]], { end: 1 });
// refilling station -> box system (the box only listens)
wire([[820, 382], [730, 382]], { end: 1, dash: 1 });
label('levels<br>(radio)', 775, 408);
// cleaning / drying / station -> box outputs
wire([[1070, 172], [1130, 172]]); wire([[1070, 270], [1130, 270]]); wire([[1070, 382], [1130, 382]]);
wire([[1130, 172], [1130, 382]]); wire([[1130, 301], [1180, 301]], { end: 1 });
// box outputs -> output column
wire([[1430, 301], [1475, 301]]); wire([[1475, 166], [1475, 334]]);
[166, 250, 334].forEach(y => wire([[1475, y], [1500, y]], { end: 1 }));
// radio between box system and local server
wire([[565, 410], [565, 560]], { end: 1, start: 1 });
label('ESP-NOW radio, channel 1', 565, 485, true);
// servers chain
wire([[660, 627], [743, 627]], { end: 1 }); label('totals,<br>sessions<br>every 10 s', 701, 583);
wire([[933, 627], [1016, 627]], { end: 1 }); label('HTTPS<br>upload<br>every 1 min', 975, 583);
wire([[1196, 627], [1279, 627]], { end: 1 }); label('HTTPS GET<br>every<br>10 s / 30 s', 1237, 583);
// local server <-> databases
wire([[565, 694], [565, 790]], { end: 1, start: 1 });
wire([[640, 694], [640, 745], [838, 745], [838, 790]], { end: 1, start: 1 });
// local server -> session record + control center
wire([[640, 560], [640, 518], [1475, 518]]); wire([[1475, 476], [1475, 560]]);
[476, 560].forEach(y => wire([[1475, y], [1500, y]], { end: 1 }));
label('session log and Control Center pages', 1010, 518);
// website -> online outputs
wire([[1450, 627], [1465, 627]]); wire([[1465, 627], [1465, 954]]);
[702, 786, 870, 954].forEach(y => wire([[1465, y], [1500, y]], { end: 1 }));
// feedback -> local database
wire([[565, 1062], [565, 908]], { end: 1 });
label('settings, rules, fixes', 565, 985);
</script>
</body></html>

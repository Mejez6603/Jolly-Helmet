<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Jolly Helmet - conceptual framework with icons</title>
<style>
  @page { size: 1800px 1976px; margin: 0 }
  :root { --navy:#0c2340; --navy2:#14325c; --orange1:#ffc060; --orange2:#f08a0c; --cream:#fff0cf; --ink:#0c2340; }
  * { box-sizing: border-box }
  html, body { margin: 0; background: #fff; font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact }
  #c { position: relative; width: 1800px; background: #fff; overflow: hidden }
  #cap { position: absolute; left: 10px; top: 14px; line-height: 1.3; color: #000 }
  #cap b { display: block; font-size: 34px }
  #cap i { display: block; font-size: 34px }
  #frame { position: absolute; left: 6px; width: 1788px; height: 1850px; border: 3px solid #000; background: #fff }
  #frame svg.w { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1 }
  .grp { position: absolute; border: 3.5px solid var(--navy2); border-radius: 22px; background: #fff; overflow: hidden; z-index: 0 }
  .grp .gh { height: 80px; background: var(--cream); border-bottom: 3.5px solid var(--navy2); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; letter-spacing: 2px; color: var(--navy2) }
  .nd { position: absolute; width: 200px; display: flex; flex-direction: column; align-items: center; z-index: 2 }
  .nd .ico { width: 112px; height: 112px }
  .nd .ico svg { width: 112px; height: 112px; display: block; overflow: visible }
  .nd .lb { margin-top: 8px; font-size: 21px; font-weight: 700; line-height: 25px; text-align: center; color: var(--ink); white-space: nowrap }
</style></head>
<body>

  <linearGradient id="gNv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27508c"/><stop offset="1" stop-color="#0c2340"/></linearGradient>

</defs></svg>
<div id="c">
  <div id="cap"><b id="capn">Figure 2</b><i id="capt">Conceptual Framework of the study</i></div>
  <div id="frame">
    <svg class="w" id="w" width="1782" height="1844" viewBox="0 0 1782 1844" xmlns="http://www.w3.org/2000/svg">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
    </svg>
  </div>

<script>
const NOCAP = /nocap/.test(location.search);
const T = NOCAP ? 8 : 118, FH = 1850;
const c = document.getElementById('c'), frame = document.getElementById('frame'), svg = document.getElementById('w');

  return `${pins}<rect x="18" y="18" width="84" height="84" rx="9" fill="url(#gNv)" ${S}/><rect x="27" y="27" width="66" height="66" rx="5" fill="none" stroke="#f59e0b" stroke-width="2.2"/>`

       + (b ? `<text x="60" y="80" text-anchor="middle" font-family="Arial" font-size="17" font-weight="800" fill="#ffc060">${b}</text>` : '');
};

function node(cx, cy, icon, label) {
  const d = document.createElement('div'); d.className = 'nd';

  d.innerHTML = `<div class="ico"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">${ICONS[icon]}</svg></div><div class="lb">${label}</div>`;
  frame.appendChild(d);
}
/* wire: points in frame coordinates; head = 'end' | 'both' | 'none' */
function wire(pts, head) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', 'M' + pts.map(q => q.join(',')).join(' L'));
  p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#111'); p.setAttribute('stroke-width', '3'); p.setAttribute('stroke-linejoin', 'round');
  if (head !== 'none') p.setAttribute('marker-end', 'url(#ah)');
  if (head === 'both') p.setAttribute('marker-start', 'url(#ah)');
  svg.appendChild(p);
}
/* the three boxes: what belongs to the Input, the Process and the Output (drawn behind the arrows and the icons) */
function group(x, y, w, h, t) { const g = document.createElement('div'); g.className = 'grp'; g.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`; g.innerHTML = `<div class="gh">${t}</div>`; frame.insertBefore(g, svg); }

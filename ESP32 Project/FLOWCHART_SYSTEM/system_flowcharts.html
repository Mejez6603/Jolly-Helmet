<script>
const DIAGRAMS = [{"id":"01_system","code":"---\ntitle: 01 - The whole system (three boxes, the Refilling Station, the servers)\n---\nflowchart TB\n  classDef cBox fill:#ffffff,stroke:#111111,stroke-width:2px,color:#111111\n  classDef cSrv fill:#ffffff,stroke:#111111,stroke-width:5px,color:#111111\n  classDef cCloud fill:#eeeeee,stroke:#111111,stroke-width:2px,stroke-dasharray:6 4,color:#111111\n  classDef cPeople fill:#ffffff,stroke:#666666,stroke-width:1.5px,stroke-dasharray:3 3,color:#111111\n  classDef cTank fill:#ffffff,stroke:#111111,stroke-width:2px,stroke-dasharray:2 3,color:#111111\n  classDef cRadio fill:#111111,stroke:#111111,color:#ffffff\n\n  CUST([\"CUSTOMER\u003cbr/\u003etouch screen, coins, helmet\"]):::cPeople\n\n  subgraph BOXES[\"THE THREE BOXES\"]\n    subgraph BX1[\"BOX 1\"]\n      S3A[\"S3A main controller\u003cbr/\u003eruns the customer flow\"]:::cBox\n      T1[\"A1 TFT display, coin slot, buzzer\u003cbr/\u003eA2 sensors: helmet, doors\u003cbr/\u003eA3 relay controller\"]:::cBox\n      MC1[\"MAIN CONTAINER\u003cbr/\u003eone cleaning liquid\"]:::cTank\n    end\n    subgraph BX2[\"BOX 2\"]\n      S3C[\"S3C main controller\u003cbr/\u003eruns the customer flow\"]:::cBox\n      T2[\"C1 TFT display, coin slot, buzzer\u003cbr/\u003eC2 sensors + relays today\u003cbr/\u003e(to be built like Box 3)\"]:::cBox\n      MC2[\"MAIN CONTAINER\u003cbr/\u003eone cleaning liquid\"]:::cTank\n    end\n    subgraph BX3[\"BOX 3\"]\n      S3B[\"S3B main controller\u003cbr/\u003eruns the customer flow\"]:::cBox\n      T3[\"B1 TFT display, coin slot, buzzer\u003cbr/\u003eB2 sensors: helmet, doors\u003cbr/\u003eB3 relay controller + heater\"]:::cBox\n      MC3[\"MAIN CONTAINER\u003cbr/\u003eone cleaning liquid\"]:::cTank\n    end\n  end\n\n  RADIO{{\"ESP-NOW RADIO, channel 1\u003cbr/\u003ebroadcast, no router, no internet\u003cbr/\u003eall boards, boxes and servers hear each other\"}}:::cRadio\n\n  SUPPLY[\"LIQUID SUPPLY\u003cbr/\u003eone supply for all three boxes\"]:::cTank\n  STATION[\"REFILLING STATION (ESP32-WROOM)\u003cbr/\u003e3 water-level sensors, 3 valves\u003cbr/\u003eworks alone: one valve at a time,\u003cbr/\u003eEMPTY first, then LOW\u003cbr/\u003etells everybody the levels\"]:::cBox\n\n  STAFF([\"OWNER / TECHNICIAN\u003cbr/\u003ephone or laptop\"]):::cPeople\n  LOCAL[\"LOCAL SERVER (ESP32-S3)\u003cbr/\u003eWi-Fi JollyHelmet-Local, 192.168.4.1\u003cbr/\u003eControl Center, session log, totals,\u003cbr/\u003esettings, Refilling Station page\"]:::cSrv\n  ONLINE[\"ONLINE SERVER (ESP32-S3)\u003cbr/\u003elistens only, never sends\u003cbr/\u003esnapshot + statistics\"]:::cSrv\n  TEAM([\"TEAM\u003cbr/\u003etypes the previous customers\"]):::cPeople\n  ENTRY[\"ENTRY board (spare ESP32)\u003cbr/\u003eWi-Fi JollyHelmet-Entry, 192.168.5.1\u003cbr/\u003eform for the previous customers\"]:::cBox\n\n  BLYNK[\"BLYNK CLOUD\u003cbr/\u003eprivate device: V0 live data\u003cbr/\u003epublic device: V0 box steps, V5 nicknames\u003cbr/\u003eevent: alert\"]:::cCloud\n\n  WEB[\"ONLINE WEB PAGE\u003cbr/\u003eMonitor: boxes drawn as machines,\u003cbr/\u003elevel dials, network map\u003cbr/\u003eAlerts, Reports\u003cbr/\u003estatic site on any web host\"]:::cBox\n  STATUS[\"status.html (customer page)\u003cbr/\u003eFREE / IN USE / OUT OF ORDER\u003cbr/\u003eoptional nickname\"]:::cBox\n  APP[\"Blynk app on a phone\u003cbr/\u003epush alerts\"]:::cBox\n  OWNER([\"OWNER / TEAM\u003cbr/\u003ephone or PC, anywhere\"]):::cPeople\n  CPHONE([\"CUSTOMER PHONE\u003cbr/\u003escans the QR sticker\"]):::cPeople\n\n  CUST \u003c--\u003e|touch, coins, helmet| BOXES\n  BOXES \u003c--\u003e|ESP-NOW| RADIO\n  STATION \u003c--\u003e|\"levels, queue, failures out\u003cbr/\u003esettings and valve test in\"| RADIO\n  SUPPLY --\u003e|through the valves| STATION\n  STATION ==\u003e|\"fills each main container\u003cbr/\u003eand reads its level\"| BOXES\n  RADIO \u003c--\u003e|status in, settings and commands out| LOCAL\n  RADIO --\u003e|listen only| ONLINE\n  LOCAL --\u003e|HubStatsPacket every 10 s:\u003cbr/\u003etotals + last 10 sessions| ONLINE\n  STAFF \u003c--\u003e|Wi-Fi JollyHelmet-Local| LOCAL\n  TEAM --\u003e ENTRY\n  ENTRY --\u003e|joins JollyHelmet-Local,\u003cbr/\u003ePOST history.json| LOCAL\n\n  ONLINE --\u003e|Wi-Fi, HTTPS,\u003cbr/\u003eevery 1 min| BLYNK\n  BLYNK --\u003e|HTTPS GET every 10 s,\u003cbr/\u003eprivate token| WEB\n  BLYNK --\u003e|event alert| APP\n  STATUS \u003c--\u003e|GET every 30 s, public token\u003cbr/\u003eoptional: write nickname V5| BLYNK\n  OWNER --\u003e WEB\n  CPHONE --\u003e STATUS\n  APP --\u003e STAFF\n"},{"id":"02_customer_flow_part1","code":"---\ntitle: 02 - Customer flow of a box, part 1 - start, checking the container, mode, coins (same for Box 1, 2 and 3)\n---\nflowchart TD\n  classDef cStart fill:#111111,stroke:#111111,color:#ffffff\n  classDef cSide fill:#ffffff,stroke:#111111,stroke-width:2px,stroke-dasharray:5 4,color:#111111\n  classDef cFault fill:#ffffff,stroke:#111111,stroke-width:4px,color:#111111\n  classDef cLink fill:#ffffff,stroke:#111111,stroke-width:2px,color:#111111\n\n  TAPS([\"START SCREEN\u003cbr/\u003eTAP anywhere to START\"]):::cStart\n  CC[\"CHECKING MAIN CONTAINER\u003cbr/\u003ePlease wait, 2 seconds\"]\n  W[\"WELCOME\u003cbr/\u003eTap to START\"]\n  D{\"on the tap: is the Refilling Station heard\u003cbr/\u003e(in the last 15 s) and is this box\u0027s\u003cbr/\u003emain container MID, HIGH or MAX?\"}\n  M{\"SELECT MODE\u003cbr/\u003eCLEANING or DRYING\"}\n  MD{\"SELECT MODE, dry only\u003cbr/\u003eCLEANING is greyed out\"}\n  COIN[\"INSERT COIN\u003cbr/\u003e15 coins = 5 min, more coins add time\u003cbr/\u003ecoin slot ON\"]\n  CAN[\"CANCEL?\u003cbr/\u003ecoins will not be refunded\"]:::cSide\n  NEXT([\"to part 2\u003cbr/\u003eOPEN THE DOOR\"]):::cLink\n  MEMO[\"EMPTY OR LOW CONTAINER, OR THE STATION IS SILENT:\u003cbr/\u003ethe box offers DRYING only.\u003cbr/\u003eThe Refilling Station fills the container by itself\u003cbr/\u003e(one valve at a time, EMPTY first).\u003cbr/\u003eNobody has to do anything: the next customer\u003cbr/\u003egets CLEANING again as soon as it reads MID or more.\"]:::cSide\n\n  subgraph OTHER[\"OTHER SCREENS\"]\n    OOO[\"OUT OF ORDER\u003cbr/\u003eS3 silent: the screen shows it by itself\u003cbr/\u003ehelmet or door sensor board, or relay board, silent:\u003cbr/\u003ethe main controller shows it\u003cbr/\u003e(entered by the firmware, before any coin is taken)\u003cbr/\u003ea helmet shut inside is released: the lock opens and the buzzer beeps\"]:::cFault\n    MNT[\"MAINTENANCE\u003cbr/\u003eswitched on from the LocalServer page\"]:::cSide\n  end\n\n  TAPS --\u003e|tap| CC\n  CC --\u003e|after 2 s| W\n  W --\u003e|tap| D\n  D --\u003e|yes| M\n  D --\u003e|\"no: EMPTY, LOW,\u003cbr/\u003eor the station is not heard\"| MD\n  M --\u003e|CLEANING button| COIN\n  M --\u003e|DRYING button| COIN\n  MD --\u003e|DRYING button| COIN\n  MD -.- MEMO\n  COIN --\u003e|CANCEL| CAN\n  CAN --\u003e|YES| TAPS\n  CAN --\u003e|NO| COIN\n  COIN --\u003e|enough coins| NEXT\n"},{"id":"03_customer_flow_part2","code":"---\ntitle: 03 - Customer flow of a box, part 2 - door, run, drying, finish (same for Box 1, 2 and 3)\n---\nflowchart TD\n  classDef cStart fill:#111111,stroke:#111111,color:#ffffff\n  classDef cRun fill:#ffffff,stroke:#111111,stroke-width:5px,color:#111111\n  classDef cSide fill:#ffffff,stroke:#111111,stroke-width:2px,stroke-dasharray:5 4,color:#111111\n  classDef cFault fill:#ffffff,stroke:#111111,stroke-width:4px,color:#111111\n  classDef cLink fill:#ffffff,stroke:#111111,stroke-width:2px,color:#111111\n\n  FROM([\"from part 1\u003cbr/\u003ethe coins are paid\"]):::cLink\n  OA[\"OPEN THE DOOR\u003cbr/\u003edoor lock released\"]\n  PL[\"PLACE THE HELMET\"]\n  CL[\"CLOSE THE DOOR\"]\n  NH[\"NO HELMET DETECTED\u003cbr/\u003e2 s\"]:::cSide\n  CLN[\"CLEANING\u003cbr/\u003eUV 1 + 2, 3 humidifiers, coin slot ON\u003cbr/\u003etime = coins bought\"]:::cRun\n  DAC[\"DRYING after cleaning\u003cbr/\u003e3:00 fixed, UV, heater\u003cbr/\u003eheater OFF for the last 30 s\"]:::cRun\n  WT[\"PLEASE WAIT\"]\n  DRY[\"DRYING\u003cbr/\u003eUV 1 + 2, heater, coin slot ON\u003cbr/\u003etime = coins bought\"]:::cRun\n  COOL[\"COOLING DOWN\u003cbr/\u003e60 s, everything off\"]:::cRun\n  AB1[\"CANCEL?\u003cbr/\u003ecoins will not be refunded\"]:::cSide\n  AB2[\"CANCEL?\u003cbr/\u003ecoins will not be refunded\"]:::cSide\n  OB[\"OPEN THE DOOR\u003cbr/\u003edoor lock released\"]\n  TK[\"TAKE THE HELMET\"]\n  CB[\"CLOSE THE DOOR\"]\n  HI[\"HELMET STILL INSIDE\u003cbr/\u003e2 s\"]:::cSide\n  TY([\"THANK YOU\u003cbr/\u003e5 s\"]):::cStart\n  BACK([\"back to part 1\u003cbr/\u003eSTART SCREEN\"]):::cLink\n  SAFE[\"SAFETY PAUSE (built into the box)\u003cbr/\u003ea door opens during a run:\u003cbr/\u003eUV, mist and heater switch off\u003cbr/\u003euntil the door is closed\"]:::cFault\n\n  FROM --\u003e OA\n  OA --\u003e|door opened| PL\n  PL --\u003e|helmet inside| CL\n  PL -.-\u003e|door closed, no helmet| NH\n  CL -.-\u003e|no helmet| NH\n  NH --\u003e OA\n  CL --\u003e|\"door closed + helmet\u003cbr/\u003eCLEANING chosen\"| CLN\n  CL --\u003e|\"door closed + helmet\u003cbr/\u003eDRYING chosen\"| WT\n  WT --\u003e|automatic| DRY\n  CLN --\u003e|time is up| DAC\n  DRY --\u003e|time is up| COOL\n  CLN --\u003e|CANCEL button| AB1\n  AB1 --\u003e|CONFIRM| DAC\n  AB1 --\u003e|RESUME| CLN\n  DRY --\u003e|CANCEL button| AB2\n  AB2 --\u003e|CONFIRM| COOL\n  AB2 --\u003e|RESUME| DRY\n  DAC --\u003e|time is up| OB\n  COOL --\u003e|time is up| OB\n  OB --\u003e|door opened| TK\n  TK --\u003e|helmet taken out| CB\n  TK -.-\u003e|door closed, helmet inside| HI\n  CB -.-\u003e|helmet inside| HI\n  HI --\u003e OB\n  CB --\u003e|door closed, helmet out| TY\n  TY --\u003e|after 5 s| BACK\n  CLN -.-\u003e SAFE\n  DRY -.-\u003e SAFE\n  DAC -.-\u003e SAFE"},{"id":"04_inside_one_box","code":"---\ntitle: 04 - Who talks to whom inside one box (messages over ESP-NOW)\n---\nsequenceDiagram\n  autonumber\n  actor C as Customer\n  participant SC as TFT display\u003cbr/\u003e(A1 / B1 / C1)\n  participant BR as Main controller\u003cbr/\u003e(S3A / S3B / S3C)\n  participant SE as Sensors\u003cbr/\u003e(A2 / B2 / C2)\n  participant RL as Relay controller\u003cbr/\u003e(A3 / B3 / C2)\n  participant RS as Refilling Station\n  participant LS as LocalServer\n  participant OS as Online Server\n  Note over SC,OS: everything is sent by ESP-NOW broadcast on channel 1, no router\n\n  BR-\u003e\u003eSC: draw this screen (CMD_STEP_RENDER)\n  C-\u003e\u003eSC: touch a button, insert coins\n  SC-\u003e\u003eBR: which button (CMD_TOUCH_ACTION) and the coin pulses\n  SE-\u003e\u003eBR: doors and helmet distance, about every 1 s and when something changes\n  RS--\u003e\u003eBR: every 1 s: the level of the three main containers (EMPTY / LOW / MID / HIGH / MAX), valves, queue, failures\n  Note over BR,RS: the box reads only its own container. CHECKING lasts 2 s, then on the tap: station silent for 15 s, or EMPTY or LOW = DRYING only. The box never asks the station for anything\n  BR-\u003e\u003eRL: the whole relay mask (CMD_SET_RELAY_MASK, repeated every ~2 s)\n  RL-\u003e\u003eBR: what is really ON, and its watchdog state (about every 1 s)\n  Note over RL: no sign of the main controller for 15 s: the relay controller switches everything off, and releases the enclosure lock if the sensors see a helmet shut inside (it learns the helmet distance from the main controller\u0027s settings broadcast and keeps it in its own flash)\n  Note over SC,BR: no sign of the main controller: the TFT display shows OUT OF ORDER by itself (nobody is left to send it a screen), says Your helmet is still inside when the sensors see one shut in, and beeps 100 ms on / 500 ms off\n  Note over BR: the helmet or door sensor board, or the relay board, is silent: the main controller shows OUT OF ORDER and takes no coins. A helmet shut inside is released after 2 s (lock opens, buzzer beeps until the door is opened). After a power cut (screen, sensors and relays on a UPS) the restarted main controller hands a trapped helmet back first\n  BR--\u003e\u003eLS: every 1 s: BoxStatusPacket (step, time left, session counter), booked coins, heartbeat\n  BR--\u003e\u003eOS: the same broadcasts (the Online Server only listens)\n  LS-\u003e\u003eBR: settings: rules (coin rate, most coins), sensors (helmet distance, station timeout), auto-dry, drying seconds (CMD_SET_CONFIG)\n  Note over BR: the main controller keeps its settings in its own flash and re-broadcasts them\n  LS-\u003e\u003eRS: settings of each container (levels, waiting times, retry) and the manual valve test\n  Note over RS: the station keeps its settings in its own flash and re-broadcasts them\n  LS-\u003e\u003eBR: maintenance: relays by hand (CMD_SET_RELAY_MASK, 2-second safety)\n  LS--\u003e\u003eOS: every 10 s: totals, coin value, last 10 sessions (HubStatsPacket)\n  RS--\u003e\u003eOS: the same level broadcast (the Online Server only listens)\n  Note over BR,LS: a finished or cancelled session: the session counter in the box status goes up, the LocalServer records it\n"},{"id":"05_refilling_station","code":"---\ntitle: 05 - The Refilling Station (one valve at a time, it works alone)\n---\nflowchart TD\n  classDef cSide fill:#ffffff,stroke:#111111,stroke-width:2px,stroke-dasharray:5 4,color:#111111\n  classDef cFault fill:#ffffff,stroke:#111111,stroke-width:4px,color:#111111\n  classDef cRun fill:#ffffff,stroke:#111111,stroke-width:5px,color:#111111\n\n  P([\"Power on: the 3 valves are CLOSED\u003cbr/\u003ewait for 1 s of readings and 3 s of quiet\"]) --\u003e A\n  A[\"5 times a second: read the 3 water-level sensors (1 s average)\u003cbr/\u003ework out each box\u0027s level (a sensor on the 3.3 V rail, or jumping about while its valve is closed, for 5 s = SENSOR FAULT: level UNKNOWN, no refill, the box offers drying only):\u003cbr/\u003eEMPTY (0), LOW (up to 499), MID (500), HIGH (1000), MAX (1200 and above)\u003cbr/\u003ethe numbers are settings of each box (LocalServer, Refilling Station page)\"] --\u003e B{\"a container is EMPTY or LOW\u003cbr/\u003eand not waiting yet?\"}\n  B --\u003e|yes| C[\"it JOINS THE QUEUE\"]\n  B --\u003e|no| D\n  C --\u003e D{\"is a valve open\u003cbr/\u003e(a refill or a manual test)?\"}\n  D --\u003e|yes| E[\"wait: a refill that is running\u003cbr/\u003eis NEVER interrupted\"]:::cSide\n  E --\u003e A\n  D --\u003e|\"no, and 1 s since the last valve closed\"| F[\"pick the next box:\u003cbr/\u003eEMPTY boxes first, then LOW boxes\u003cbr/\u003einside a group the one that waited longest\u003cbr/\u003ethen Box 1, Box 2, Box 3\"]\n  F --\u003e G[\"OPEN that box\u0027s valve\u003cbr/\u003e(only ONE valve can ever be open)\"]:::cRun\n  G --\u003e H{\"container reached MAX?\"}\n  H --\u003e|yes| I[\"CLOSE the valve\u003cbr/\u003ethe refill WORKED, the failure flag is cleared\"]\n  I --\u003e A\n  H --\u003e|no| J{\"the level does not rise\u003cbr/\u003e30 s while EMPTY, 5 s when LOW\u003cbr/\u003eor the valve was open 3 minutes?\"}\n  J --\u003e|no| H\n  J --\u003e|yes| K[\"CLOSE the valve\u003cbr/\u003ethe refill FAILED: flag set,\u003cbr/\u003ealert on the Online web page and the LocalServer\"]:::cFault\n  K --\u003e L[\"wait 60 s, then join the queue again\u003cbr/\u003e(for ever, until a refill works)\"]\n  L --\u003e A\n\n  subgraph TELL[\"WHAT IT BROADCASTS\"]\n    T1[\"every 1 s, and at once when something changes:\u003cbr/\u003elevels and raw values of the 3 containers, which valve is open,\u003cbr/\u003ewho is waiting, which refill failed, the box\u0027s own level edges\u003cbr/\u003eThe boxes read their own container: EMPTY or LOW or silent for 15 s = DRYING only\"]\n  end\n  A -.-\u003e T1\n\n  subgraph TEST[\"MANUAL VALVE TEST\"]\n    M1[\"Test valve button\u003cbr/\u003e(LocalServer, Refilling Station page)\"] --\u003e M2{\"no valve open and none\u003cbr/\u003eclosed in the last second?\"}\n    M2 --\u003e|yes| M3[\"open that valve for 2 s (a setting),\u003cbr/\u003ethen close it. The queue and the flags are not touched\"]:::cSide\n    M2 --\u003e|no| M4[\"refused: the page says Busy\"]:::cSide\n  end\n"},{"id":"06_localserver","code":"---\ntitle: 06 - LocalServer (Control Center) inside\n---\nflowchart TB\n  classDef cSide fill:#ffffff,stroke:#111111,stroke-width:2px,stroke-dasharray:5 4,color:#111111\n  classDef cFault fill:#ffffff,stroke:#111111,stroke-width:4px,color:#111111\n\n  P([\"Power on\"]) --\u003e B1[\"load the saved settings (flash)\u003cbr/\u003emount the log storage (FFat)\"]\n  B1 --\u003e B2{\"log storage damaged?\"}\n  B2 --\u003e|yes| B3[\"re-created EMPTY\u003cbr/\u003ered note on the Dashboard:\u003cbr/\u003erestore the backup CSV\"]:::cFault\n  B2 --\u003e|no| B4\n  B3 --\u003e B4[\"start Wi-Fi JollyHelmet-Local (192.168.4.1)\u003cbr/\u003ecaptive portal, web server,\u003cbr/\u003eESP-NOW on channel 1\"]\n  B4 --\u003e HUB((\"RUNNING\"))\n\n  subgraph RX[\"FROM THE RADIO\"]\n    R1[\"box status of every box (every 1 s)\"] --\u003e R2{\"new finished or\u003cbr/\u003ecancelled session?\"}\n    R2 --\u003e|yes| R3[\"record it: date, time, box,\u003cbr/\u003eFinished or Cancelled, coins, minutes\u003cbr/\u003epermanent session log + totals\"]\n    R2 --\u003e|no| R4[\"update the live step\u003cbr/\u003eand the time left\"]\n    R5[\"booked coins of the boxes → revenue\u003cbr/\u003esensor and relay status → Dashboard\u003cbr/\u003eRefilling Station levels, valves, queue,\u003cbr/\u003efailures → Dashboard\"]\n  end\n  subgraph TX[\"TO THE RADIO\"]\n    S1[\"every 1 s: heartbeat\u003cbr/\u003e\u003cbr/\u003eevery 10 s: totals + last 10 sessions → Online Server\u003cbr/\u003e\u003cbr/\u003eon request: settings and maintenance → the box main controllers,\u003cbr/\u003esettings and valve test → the Refilling Station\"]\n  end\n  subgraph WB[\"WEB PAGES (phone or laptop)\"]\n    W1[\"Dashboard asks /api/status every second\u003cbr/\u003e(3 boxes, the Refilling Station card)\u003cbr/\u003e\u003cbr/\u003eBox 1, 2 and 3 pages: rules, sensors, auto-dry, drying, relays, refresh\u003cbr/\u003eRefilling Station page: level edges and waiting times of each box,\u003cbr/\u003equeue, manual valve test\u003cbr/\u003e\u003cbr/\u003eSettings: set the clock (phone), download the log CSV,\u003cbr/\u003erestore from backup CSV, history.json, coin value, Reset Stats\u003cbr/\u003e\u003cbr/\u003eday viewer: Machine and JSON tabs\"]\n  end\n  HUB --\u003e R1\n  HUB --\u003e R5\n  HUB --\u003e S1\n  HUB --\u003e W1\n  ENTRY[\"ENTRY board\u003cbr/\u003ePOST history.json\"]:::cSide --\u003e W1\n  CR[\"a restart nobody planned:\u003cbr/\u003ebreadcrumbs → the last 3 crash reports\u003cbr/\u003ekept in flash: Settings, This board\"]:::cSide\n  HUB -.-\u003e CR\n"},{"id":"07_online_server","code":"---\ntitle: 07 - Online Server inside\n---\nflowchart TD\n  classDef cSide fill:#ffffff,stroke:#111111,stroke-width:2px,stroke-dasharray:5 4,color:#111111\n\n  A([\"Power on\"]) --\u003e B[\"load the saved setup:\u003cbr/\u003eWi-Fi, Blynk token, interval, time zone\"]\n  B --\u003e C[\"start its own Wi-Fi JollyHelmet-Online + captive portal\u003cbr/\u003estart ESP-NOW (listen only, never sends)\"]\n  C --\u003e D[\"every 1 s: take a snapshot of what was heard\u003cbr/\u003e(the 11 box boards, the Refilling Station and the LocalServer)\u003cbr/\u003ecount sessions per box, per hour, per weekday, per day\u003cbr/\u003ework out the alerts: out of order, station offline, refill failed, board not heard\"]\n  D --\u003e E{\"Wi-Fi and token saved,\u003cbr/\u003eand the interval reached?\u003cbr/\u003e(30 s to 1 h, default 1 min)\"}\n  E --\u003e|no| D\n  E --\u003e|yes| F{\"somebody is using\u003cbr/\u003ethe setup page?\"}\n  F --\u003e|yes| G[\"wait 5 s\"]\n  G --\u003e D\n  F --\u003e|no| H[\"BURST (5 to 10 s, not listening to the machines)\u003cbr/\u003eleave channel 1, join the Wi-Fi, get the time (NTP)\"]\n  H --\u003e I[\"HTTPS to Blynk (certificate checked)\u003cbr/\u003e1. private device V0: the live JSON\u003cbr/\u003e(the 3 boxes, the Refilling Station\u0027s level of each container,\u003cbr/\u003eboard flags, statistics)\u003cbr/\u003e2. public device V0: box steps only\u003cbr/\u003e3. optional: V1 to V4 and the alert event\"]\n  I --\u003e J[\"back to channel 1\"]\n  J --\u003e D\n  K[\"setup page, looks like a router page:\u003cbr/\u003eNetwork Map, Internet, Blynk, More settings\u003cbr/\u003echoose the Wi-Fi, paste the Blynk token, Save\"]:::cSide --\u003e K2[\"Save: the Wi-Fi is tested first\u003cbr/\u003e(works without a token),\u003cbr/\u003ethen Blynk\"]:::cSide\n  K2 --\u003e H\n  M[\"also heard: totals from the LocalServer (every 10 s)\"]:::cSide -.-\u003e D\n"},{"id":"08_blynk_and_web","code":"---\ntitle: 08 - Blynk and the web pages\n---\nsequenceDiagram\n  autonumber\n  participant OS as Online Server\n  participant BL as Blynk cloud\n  participant MP as Online web page, Monitor\u003cbr/\u003e(owner, technician)\n  participant CP as status.html\u003cbr/\u003e(customer phone, QR sticker)\n  participant AP as Blynk app\u003cbr/\u003e(a phone)\n\n  loop every 1 min (30 s to 1 h)\n    OS-\u003e\u003eBL: write the private device V0 (live JSON: the 3 boxes with step, time, coins, doors, helmet and relays, the Refilling Station\u0027s level of each main container with valve, waiting and failed, board flags, statistics, revenue)\n    OS-\u003e\u003eBL: write the public device V0 (per box: step, seconds left, main controller heard, session counter)\n  end\n  OS-\u003e\u003eBL: a new alert: event \u0027alert\u0027 (out of order, Refilling Station offline, refill failed, board not heard)\n  BL--\u003e\u003eAP: push notification (works with the page closed)\n\n  loop every 10 s, only while the tab is open and visible\n    MP-\u003e\u003eBL: HTTPS GET the private V0 (token typed once, kept in that browser)\n    BL--\u003e\u003eMP: the live JSON\n    Note over MP: LIVE / DELAYED / OLD DATA, each box drawn as a little machine, three level dials from the Refilling Station (red EMPTY or LOW, yellow MID, green HIGH and MAX, waiting or refilling), network map, Alerts with sounds, Reports\n  end\n\n  loop every 30 s, only while the page is open and visible\n    CP-\u003e\u003eBL: HTTPS GET the public V0 (public token, in the QR code)\n    BL--\u003e\u003eCP: step and seconds left of each box\n    Note over CP: TAPS = FREE, other steps = IN USE with minutes left, OUT OF ORDER, NO INFORMATION\n  end\n\n  opt the customer types a nickname (only after the coins are in)\n    CP-\u003e\u003eBL: write V5: name, the box\u0027s session counter, time\n    BL--\u003e\u003eCP: V5 is read back and shown on the box card\n  end\n  Note over CP,BL: the nickname disappears when the box\u0027s session counter changes (the cycle ended)\n"},{"id":"09_complete_system","code":"---\ntitle: 09 - The complete Jolly Helmet system, end to end (hardware, LocalServer, Online Server, database, GitHub, Vercel, website)\n---\nflowchart TB\n  classDef cBox fill:#ffffff,stroke:#111111,stroke-width:2px,color:#111111\n  classDef cSrv fill:#ffffff,stroke:#111111,stroke-width:5px,color:#111111\n  classDef cDb fill:#eeeeee,stroke:#111111,stroke-width:3px,color:#111111\n  classDef cPeople fill:#ffffff,stroke:#666666,stroke-width:1.5px,stroke-dasharray:3 3,color:#111111\n  classDef cTank fill:#ffffff,stroke:#111111,stroke-width:2px,stroke-dasharray:2 3,color:#111111\n  classDef cRadio fill:#111111,stroke:#111111,color:#ffffff\n  classDef cCode fill:#ffffff,stroke:#111111,stroke-width:3px,color:#111111\n\n  CUST([\"CUSTOMER\u003cbr/\u003etouch screen, coins, helmet\"]):::cPeople\n\n  subgraph BOXES[\"1 · BOX 1, 2, 3\"]\n    MC[\"MAIN CONTROLLER (ESP32-S3)\u003cbr/\u003eruns the customer flow:\u003cbr/\u003ecoins, mode, timer, cleaning, drying\u003cbr/\u003eBox 1 = S3A · Box 2 = S3C · Box 3 = S3B\u003cbr/\u003e(the three boxes are the same build)\"]:::cBox\n    TERM[\"TFT DISPLAY + COIN SLOT + BUZZER\u003cbr/\u003eSENSORS: helmet, doors\u003cbr/\u003eRELAY CONTROLLER: UV, mist, heater, fan, locks\u003cbr/\u003eBox 1 = A1 A2 A3 · Box 2 = C1 C2 · Box 3 = B1 B2 B3\"]:::cBox\n    TANK[\"MAIN CONTAINER\u003cbr/\u003eone cleaning liquid\"]:::cTank\n  end\n  SUPPLY[\"LIQUID SUPPLY\"]:::cTank\n  STATION[\"1 · REFILLING STATION (ESP32-WROOM)\u003cbr/\u003e3 water-level sensors, 3 valves,\u003cbr/\u003eone valve at a time\"]:::cBox\n\n  RADIO{{\"2 · ESP-NOW RADIO, channel 1\u003cbr/\u003ebroadcast, no router, no internet\"}}:::cRadio\n\n  ENTRY[\"ENTRY board (spare ESP32)\u003cbr/\u003eform for the previous customers\"]:::cBox\n  STAFF([\"OWNER / TECHNICIAN\u003cbr/\u003ephone or laptop on Wi-Fi JollyHelmet-Local\"]):::cPeople\n  LOCAL[\"3 · LOCAL SERVER (ESP32-S3)\u003cbr/\u003eWi-Fi JollyHelmet-Local, 192.168.4.1\u003cbr/\u003eControl Center: Dashboard, Box pages,\u003cbr/\u003eRefilling Station page, Settings\u003cbr/\u003eworks without internet\"]:::cSrv\n  LDB[(\"LOCAL DATABASE (inside the LocalServer)\u003cbr/\u003esettings: flash\u003cbr/\u003epermanent session log + totals: FFat\u003cbr/\u003ebackup CSV: download and restore\u003cbr/\u003elast 3 crash reports: flash\")]:::cDb\n\n  ONLINE[\"4 · ONLINE SERVER (ESP32-S3)\u003cbr/\u003elistens only, never sends to the machines\u003cbr/\u003e1-second snapshot, statistics, alerts\u003cbr/\u003eburst upload every 1 min (30 s to 1 h)\"]:::cSrv\n  ODB[(\"saved setup (flash): Wi-Fi, Blynk token,\u003cbr/\u003einterval, time zone\u003cbr/\u003estatistics counters:\u003cbr/\u003eper box, hour, weekday, day\")]:::cDb\n\n  BLYNK[(\"5 · BLYNK CLOUD = THE ONLINE DATABASE\u003cbr/\u003eprivate device V0: live JSON (3 boxes, levels,\u003cbr/\u003eboard flags, statistics, revenue)\u003cbr/\u003epublic device V0: box steps · V5: nicknames\u003cbr/\u003eevent: alert\")]:::cDb\n\n  subgraph CODE[\"6 · CODE AND HOSTING\"]\n    DEV([\"DEVELOPER\u003cbr/\u003eedits and pushes\"]):::cPeople\n    FILES[\"ONLINE_WEB FOLDER\u003cbr/\u003eindex.html, status.html,\u003cbr/\u003ecss, js, img\u003cbr/\u003e(Blynk token left empty)\"]:::cBox\n    GITHUB[\"GITHUB\u003cbr/\u003erepository with the\u003cbr/\u003eONLINE_WEB files,\u003cbr/\u003ehistory of every change\"]:::cCode\n    VERCEL[\"VERCEL\u003cbr/\u003edeploys the files by itself\u003cbr/\u003eon every push (static site)\"]:::cCode\n    SITE[\"WEBSITE (public address)\u003cbr/\u003eMonitor · Alerts · Reports\u003cbr/\u003estatus.html (customer page)\u003cbr/\u003eonly serves the page files,\u003cbr/\u003enever sees the data\u003cbr/\u003e(inside: charts 10 and 11)\"]:::cSrv\n  end\n\n  OWNER([\"7 · OWNER / TEAM\u003cbr/\u003ebrowser on phone or PC, anywhere\u003cbr/\u003etoken typed once, kept in that browser\"]):::cPeople\n  CPHONE([\"7 · CUSTOMER PHONE\u003cbr/\u003escans the QR sticker\u003cbr/\u003eFREE / IN USE / OUT OF ORDER\"]):::cPeople\n  APP[\"BLYNK APP on a phone\u003cbr/\u003epush alerts, even with the page closed\"]:::cBox\n\n  CUST \u003c--\u003e|\"touch, coins, helmet\"| MC\n  MC \u003c--\u003e|\"screens, coins,\u003cbr/\u003esensors, relays\"| TERM\n  SUPPLY --\u003e STATION\n  STATION ==\u003e|\"fills each container\u003cbr/\u003eand reads its level\"| TANK\n  MC \u003c--\u003e|ESP-NOW| RADIO\n  STATION \u003c--\u003e|\"levels out\u003cbr/\u003esettings in\"| RADIO\n\n  ENTRY --\u003e|\"POST history.json\"| LOCAL\n  STAFF \u003c--\u003e|\"Wi-Fi\"| LOCAL\n  RADIO \u003c--\u003e|\"status in,\u003cbr/\u003ecommands out\"| LOCAL\n  RADIO --\u003e|\"listen only\"| ONLINE\n  LOCAL \u003c--\u003e LDB\n  LOCAL --\u003e|\"HubStatsPacket every 10 s:\u003cbr/\u003etotals + last 10 sessions\"| ONLINE\n\n  ONLINE \u003c--\u003e ODB\n  ONLINE ==\u003e|\"home Wi-Fi, HTTPS:\u003cbr/\u003ewrite V0, send event alert\"| BLYNK\n\n  DEV --\u003e FILES\n  FILES --\u003e|\"git push\"| GITHUB\n  GITHUB --\u003e|\"every push starts a deploy\"| VERCEL\n  VERCEL --\u003e|\"publishes\"| SITE\n\n  SITE --\u003e|\"A · page files\u003cbr/\u003e(HTML, CSS, JS)\"| OWNER\n  SITE --\u003e|\"A · status.html\"| CPHONE\n  BLYNK \u003c--\u003e|\"B · HTTPS GET every 10 s\u003cbr/\u003eprivate token\"| OWNER\n  BLYNK \u003c--\u003e|\"B · HTTPS GET every 30 s, public token\u003cbr/\u003eoptional: nickname written to V5\"| CPHONE\n  BLYNK --\u003e|\"event alert\"| APP\n"},{"id":"10_website_monitor","code":"---\ntitle: 10 - The website inside, part 1 - the Monitor (index.html, for the owner and the team)\nconfig:\n  flowchart:\n    wrappingWidth: 380\n---\nflowchart TB\n  classDef cBox fill:#ffffff,stroke:#111111,stroke-width:2px,color:#111111\n  classDef cSrv fill:#ffffff,stroke:#111111,stroke-width:5px,color:#111111\n  classDef cDb fill:#eeeeee,stroke:#111111,stroke-width:3px,color:#111111\n  classDef cPeople fill:#ffffff,stroke:#666666,stroke-width:1.5px,stroke-dasharray:3 3,color:#111111\n  classDef cSide fill:#ffffff,stroke:#111111,stroke-width:2px,stroke-dasharray:5 4,color:#111111\n  classDef cBad fill:#ffffff,stroke:#111111,stroke-width:4px,color:#111111\n\n  OPEN([\"The owner or team opens the website address (index.html)\"]):::cPeople\n  FILES[\"The browser downloads the page files from the website (Vercel): HTML, CSS, JS\u003cbr/\u003eFrom here on the page runs inside the browser and talks to Blynk by itself.\u003cbr/\u003eIt only READS: it never writes to Blynk. The website never sees the data.\"]:::cSrv\n  TOK{\"Blynk token known?\"}\n  CONN[\"Connect screen: paste the token\u003cbr/\u003eor try the demo (made-up data)\"]:::cSide\n  SAVE[\"token saved in this browser only, the page reloads\"]:::cSide\n  BLYNK[(\"BLYNK CLOUD\u003cbr/\u003ethe online database\u003cbr/\u003eprivate device: V0 live JSON\")]:::cDb\n\n  LOOP[\"REFRESH LOOP: every 10 s (Settings can change it)\u003cbr/\u003eonly while the tab is open and visible, wrong token: every 30 s\"]\n  GET[\"HTTPS GET getAll from blynk.cloud (gives up after 12 s)\"]\n  ANS{\"what came back?\"}\n  OKD[\"V0 read as JSON: the 3 boxes, levels, board flags, statistics\u003cbr/\u003eremember when the counter seq last changed\u003cbr/\u003ekeep the last 90 container levels for the little graphs\"]\n  TICK{\"how old is the data?\u003cbr/\u003e(checked every second)\"}\n  ACT[\"Status: Active\u003cbr/\u003e(fresh, or later than usual)\"]\n  INACT[\"Status: Inactive\u003cbr/\u003emachine cards and level dials say Inactive, the network map turns red\u003cbr/\u003etooltip: token wrong / cannot reach Blynk / no data yet / data not yet updated\"]:::cBad\n  DRAW[\"DRAW THE PAGE AGAIN, after every reading\"]\n\n  MONTAB[\"MONITOR tab\u003cbr/\u003ebadge Status Active / Inactive + updated x ago\u003cbr/\u003ethe 3 boxes drawn as machines\u003cbr/\u003e3 level dials from the Refilling Station\u003cbr/\u003enetwork map, analytics tiles\"]\n  REPTAB[\"REPORTS tab\u003cbr/\u003erevenue and customers per day (14 days, 7-day average)\u003cbr/\u003ethis week against last, busiest hours and weekdays\u003cbr/\u003ewhat each box earns, day-by-day table\u003cbr/\u003eCSV download, Print / save as PDF\"]\n  DET[\"ALERTS: work out what is wrong right now\u003cbr/\u003edata not yet updated · board not active · no board active at all\u003cbr/\u003ebox OUT OF ORDER · door opened during a run · container low\u003cbr/\u003erefill failed · Refilling Station not active\"]\n  TOOLS[\"Buttons: QR (QR code, link and printable sign for the customer page)\u003cbr/\u003eSettings (token, server, refresh time) · light / dark\"]:::cSide\n  NEWA{\"a new alert,\u003cbr/\u003eor one cleared?\"}\n  SHOW[\"banner Needs attention: one coloured row per alert, highest first\u003cbr/\u003eCRITICAL red · WARNING orange · NOTICE blue · INFO grey\u003cbr/\u003eALERTS tab: Active now + the LOG (kept in this browser, CSV download)\u003cbr/\u003enumber in the tab title and icon\"]\n  SND[\"its own sound, optional browser notification\u003cbr/\u003eCRITICAL repeats every minute until Acknowledge\u003cbr/\u003ecleared: a chime\"]\n\n  OPEN --\u003e FILES --\u003e TOK\n  TOK --\u003e|\"no\"| CONN --\u003e SAVE\n  SAVE --\u003e|\"reload\"| LOOP\n  TOK --\u003e|\"yes: token in the address,\u003cbr/\u003ein js/config.js, or saved in this browser\"| LOOP\n  LOOP --\u003e GET\n  GET \u003c--\u003e|\"private token\"| BLYNK\n  GET --\u003e ANS\n  ANS --\u003e|\"error: wrong token, no internet,\u003cbr/\u003eor Blynk did not answer\"| INACT\n  ANS --\u003e|\"V0 empty: the Online Server\u003cbr/\u003ehas not written anything yet\"| INACT\n  ANS --\u003e|\"V0 has data\"| OKD\n  OKD --\u003e TICK\n  TICK --\u003e|\"fresh: within 2 x interval + 15 s\u003cbr/\u003elater than usual: within 6 x interval + 30 s\"| ACT\n  TICK --\u003e|\"older than that\"| INACT\n  ACT --\u003e DRAW\n  INACT --\u003e DRAW\n  DRAW --\u003e MONTAB\n  DRAW --\u003e REPTAB\n  DRAW --\u003e DET\n  MONTAB -.-\u003e TOOLS\n  DET --\u003e NEWA\n  NEWA --\u003e|\"yes\"| SHOW\n  NEWA --\u003e|\"yes\"| SND\n  DRAW -.-\u003e|\"wait for the next reading\"| LOOP\n"},{"id":"11_website_customer","code":"---\ntitle: 11 - The website inside, part 2 - the customer page (status.html, from the QR sticker)\nconfig:\n  flowchart:\n    wrappingWidth: 380\n---\nflowchart TB\n  classDef cBox fill:#ffffff,stroke:#111111,stroke-width:2px,color:#111111\n  classDef cSrv fill:#ffffff,stroke:#111111,stroke-width:5px,color:#111111\n  classDef cDb fill:#eeeeee,stroke:#111111,stroke-width:3px,color:#111111\n  classDef cPeople fill:#ffffff,stroke:#666666,stroke-width:1.5px,stroke-dasharray:3 3,color:#111111\n  classDef cSide fill:#ffffff,stroke:#111111,stroke-width:2px,stroke-dasharray:5 4,color:#111111\n  classDef cBad fill:#ffffff,stroke:#111111,stroke-width:4px,color:#111111\n\n  OPEN([\"A customer scans the QR sticker on the machine\u003cbr/\u003ethe address is status.html with the PUBLIC token in it\"]):::cPeople\n  FILES[\"The phone downloads the page files from the website (Vercel): HTML, CSS, JS\u003cbr/\u003eFrom here on the page runs inside the phone and talks to Blynk by itself.\u003cbr/\u003eThe website never sees the data.\"]:::cSrv\n  PTOK{\"public token known?\"}\n  PNO[\"message: there is no information,\u003cbr/\u003eplease look at the machine itself\"]:::cBad\n  BLYNK[(\"BLYNK CLOUD\u003cbr/\u003ethe online database\u003cbr/\u003epublic device: V0 box steps, V5 nicknames\u003cbr/\u003eholds only: free, busy or out of order\")]:::cDb\n\n  PLOOP[\"every 30 s, only while the page is open and visible\u003cbr/\u003eHTTPS GET the PUBLIC device: V0 (box steps) and V5 (nicknames)\"]\n  PUSE{\"data usable?\"}\n  PBAD[\"every card: the information is not up to date,\u003cbr/\u003eplease look at the machine itself\"]:::cBad\n  CLS[\"each box is classed from its step name\u003cbr/\u003eboard silent: NO INFORMATION · step OUT OF ORDER · step MAINTENANCE\u003cbr/\u003eIDLE or TAPS: FREE · SELECT DRY ONLY: drying only\u003cbr/\u003eSAFETY PAUSE: IN USE, paused · any other step: IN USE with minutes left\"]\n  PCARD[\"three cards: Box 1, Box 2, Box 3\u003cbr/\u003eEnglish / Filipino button, prices and the something-wrong line from js/config.js\u003cbr/\u003eredrawn every second (updated x ago, minutes left)\"]\n  NAMEQ{\"customer taps\u003cbr/\u003eAdd your name?\"}\n  WR[\"the page writes ONE value, the only write of the whole website:\u003cbr/\u003eV5 = the name + the box session counter + time (public token)\"]\n  CLR[\"everybody sees the name on that card, for example Maria\u0027s helmet\u003cbr/\u003eit clears when the session counter changes (the cycle ended),\u003cbr/\u003eor after 45 minutes if there is no counter\u003cbr/\u003ethe customer\u0027s own phone says: your helmet is done\"]\n\n  OPEN --\u003e FILES --\u003e PTOK\n  PTOK --\u003e|\"no\"| PNO\n  PTOK --\u003e|\"yes: QR address, js/config.js, saved in the phone,\u003cbr/\u003eor a staff phone that has the private token\"| PLOOP\n  PLOOP \u003c--\u003e|\"public token\"| BLYNK\n  PLOOP --\u003e PUSE\n  PUSE --\u003e|\"no: an error, or the data is older than\u003cbr/\u003e4 min or 4 x interval + 1 min\"| PBAD\n  PUSE --\u003e|\"yes\"| CLS\n  CLS --\u003e PCARD\n  PCARD --\u003e NAMEQ\n  NAMEQ --\u003e|\"yes (only on a box\u003cbr/\u003ethat is running a cycle)\"| WR\n  WR --\u003e|\"write V5\"| BLYNK\n  WR --\u003e CLR\n  PCARD -.-\u003e|\"wait 30 s, then ask again\"| PLOOP\n"}];

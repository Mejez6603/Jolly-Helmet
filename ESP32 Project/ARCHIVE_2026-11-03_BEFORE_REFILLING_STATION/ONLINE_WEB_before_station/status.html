<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jolly Helmet - which machine is free?</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/status.css">
<!--
  JOLLY HELMET - CUSTOMER STATUS PAGE (for the public).
  Shows whether Box 1, Box 2 and Box 3 are free, in use (about how long) or out of order. Nothing else: no revenue, no settings, no alerts.
  A customer can also add an OPTIONAL name or nickname to the machine in use; it is shown to everybody on that machine's card and clears by itself when the
  cycle ends. That name is the only thing this page ever writes, and only into the public device's names datastream (js/config.js: names, namesPin).
  It reads the PUBLIC status Blynk device (a second Blynk device whose token may be public: it only holds those three boxes' step and time left, plus the names).
  Put its token in js/config.js (publicToken) or open this page as  status.html#t=THE_PUBLIC_TOKEN  (the QR code in the monitor does that).
  Try it:  status.html?demo     English / Filipino: the button at the top (the Filipino texts are in js/status.js: please have a native speaker check them).
-->
</head>
<body class="statuspage">
<header class="shead">
  <div class="shead-in">
    <div class="brand"><img src="img/logo.png" alt=""><div><b>Jolly Helmet</b><small id="tag">Make your Helmet Happy Again!</small></div></div>
    <div class="sp"></div>
    <button class="ibtn" id="lang" type="button" aria-label="Language">Filipino</button>
  </div>
</header>

<main class="smain">
  <h1 id="title">Which machine is free?</h1>
  <p class="upd" id="upd" aria-live="polite">&nbsp;</p>
  <div id="notice"></div>
  <div id="donebanner" aria-live="assertive"></div>
  <div id="boxes" class="sboxes"></div>

  <section class="card how">
    <h2 id="howT">How it works</h2>
    <ol id="how"></ol>
  </section>
  <section class="card how">
    <h2 id="helpT">Something wrong?</h2>
    <p id="help"></p>
  </section>
  <p class="fine" id="foot"></p>
</main>

<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/names.js"></script>
<script src="js/demo.js"></script>
<script src="js/status.js"></script>
</body>
</html>

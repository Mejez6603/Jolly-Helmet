<!--
  Builds MANUAL/JollyHelmet_UserManual.docx from JollyHelmet_UserManual.html (the same content, as a flowing, editable Word layout).
  Raw OOXML + JSZip, no Word needed. Needs the manual served on http://localhost:8766/m/ with a POST /save/<path> endpoint (see README).
-->
<pre id="log">working...</pre>
<script>
const LOG = m => { document.getElementById('log').textContent += '\n' + m; };
const TW = 9648;                                   // text width in twips: Letter, 0.9 in side margins
const NAVY = '14325C', DEEP = '0C2340', AMBER = 'F59E0B', INK = '1D2433', GRAY = '56607A';
const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
const REL_IMG = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/image';
const EMU = 914400;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// ------------------------------------------------------------------ images
const media = {};            // 'media/imageN.ext' -> bytes
const imgCache = {};         // url -> {name,w,h,ext}
let imgN = 0, docPrId = 0;
function pngSize(b) { const dv = new DataView(b.buffer, b.byteOffset); return { w: dv.getUint32(16), h: dv.getUint32(20) }; }
function jpegSize(b) { let i = 2; while (i < b.length) { if (b[i] !== 0xFF) { i++; continue; } const m = b[i + 1]; if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) return { h: (b[i + 5] << 8) | b[i + 6], w: (b[i + 7] << 8) | b[i + 8] }; i += 2 + ((b[i + 2] << 8) | b[i + 3]); } throw new Error('jpeg size'); }
async function loadImg(url, optional) {
  if (imgCache[url]) return imgCache[url];
  const r = await fetch('/m/' + url + '?x=' + Date.now());
  if (!r.ok) { if (optional) return null; throw new Error('missing image ' + url); }
  const b = new Uint8Array(await r.arrayBuffer());
  const isPng = b[0] === 0x89 && b[1] === 0x50;
  const sz = isPng ? pngSize(b) : jpegSize(b), ext = isPng ? 'png' : 'jpeg';

  media[name] = b;
  return (imgCache[url] = { name, w: sz.w, h: sz.h, ext });
}
// relationship registry per part
function mkRels() { const list = []; let n = 0; return { list, add(type, target) { const id = 'rId' + (++n); list.push({ id, type, target }); return id; } }; }
const docRels = mkRels(), hdrRels = mkRels();
function relXml(rels) { return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + rels.list.map(r => `<Relationship Id="${r.id}" Type="${r.type}" Target="${r.target}"/>`).join('') + '</Relationships>'; }

  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${id}" name="Picture ${id}" descr="${esc(alt || '')}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${id}" name="${esc(img.name)}" descr="${esc(alt || '')}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom>${ln}</pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}

// ------------------------------------------------------------------ xml helpers
function rPr(o) {

  if (o.b) x += '<w:b/><w:bCs/>';
  if (o.i) x += '<w:i/><w:iCs/>';
  if (o.color) x += `<w:color w:val="${o.color}"/>`;
  if (o.sp) x += `<w:spacing w:val="${o.sp}"/>`;
  if (o.sz) x += `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`;
  if (o.shd) x += `<w:shd w:val="clear" w:color="auto" w:fill="${o.shd}"/>`;

const T = (text, o = {}) => `<w:r>${rPr(o)}<w:t xml:space="preserve">${esc(text)}</w:t></w:r>`;
// Word index: every paragraph that mentions an index term gets a hidden XE field for it (at most XE_MAX per term). The INDEX field is built from them.
let INDEX_TERMS = [], xeOn = true; const xeCount = {}, XE_MAX = 12;
function xeRuns(runs) {

    xeCount[t.name] = (xeCount[t.name] || 0) + 1;

}
function runsXml(runs, base = {}) {

}
function runsXmlPlain(runs, base = {}) {
  return runs.map(r => {

    const o = { ...base };

    if (r.i) o.i = true;

function P(content, o = {}) {

  if (o.pb) pp += '<w:pageBreakBefore/>';

    pp += `<w:spacing${o.before !== undefined ? ` w:before="${o.before}"` : ''}${o.after !== undefined ? ` w:after="${o.after}"` : ''}${o.line ? ` w:line="${o.line}" w:lineRule="${o.rule || 'auto'}"` : ''}/>`;
  if (o.jc) pp += `<w:jc w:val="${o.jc}"/>`;

const gap = (h = 100) => P('', { before: 0, after: 0, line: h, rule: 'exact' });
const NOB = '<w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/>';
function TC(w, content, o = {}) {
  let pr = `<w:tcW w:w="${w}" w:type="dxa"/>`;
  if (o.span) pr += `<w:gridSpan w:val="${o.span}"/>`;
  if (o.borders) pr += `<w:tcBorders>${o.borders}</w:tcBorders>`;
  if (o.fill) pr += `<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`;
  if (o.mar) pr += `<w:tcMar>${o.mar}</w:tcMar>`;
  if (o.va) pr += `<w:vAlign w:val="${o.va}"/>`;

}
const MAR = (t, l, b, r) => `<w:top w:w="${t}" w:type="dxa"/><w:left w:w="${l}" w:type="dxa"/><w:bottom w:w="${b}" w:type="dxa"/><w:right w:w="${r}" w:type="dxa"/>`;
function TR(cells, o = {}) {
  let pr = '';
  if (o.cant !== false) pr += '<w:cantSplit/>';
  if (o.h) pr += `<w:trHeight w:val="${o.h}"${o.rule ? ` w:hRule="${o.rule}"` : ''}/>`;
  if (o.header) pr += '<w:tblHeader/>';
  return `<w:tr>${pr ? `<w:trPr>${pr}</w:trPr>` : ''}${cells}</w:tr>`;
}
function TBL(widths, rows, o = {}) {
  const tw = widths.reduce((a, b) => a + b, 0);
  const cm = o.cellMar || MAR(0, 108, 0, 108);
  return `<w:tbl><w:tblPr><w:tblW w:w="${tw}" w:type="dxa"/>${o.jc ? `<w:jc w:val="${o.jc}"/>` : ''}<w:tblInd w:w="0" w:type="dxa"/><w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar>${cm}</w:tblCellMar><w:tblLook w:val="0000" w:firstRow="0" w:lastRow="0" w:firstColumn="0" w:lastColumn="0" w:noHBand="1" w:noVBand="1"/></w:tblPr><w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${rows}</w:tbl>`;

// ------------------------------------------------------------------ DOM -> blocks
function inline(node, st, out) {
  for (const n of node.childNodes) {
    if (n.nodeType === 3) { out.push({ t: n.nodeValue.replace(/\s+/g, ' '), ...st }); continue; }
    if (n.nodeType !== 1) continue;
    const tag = n.tagName;
    if (tag === 'BR') out.push({ br: true });
    else if (tag === 'B' || tag === 'STRONG') inline(n, { ...st, b: true }, out);
    else if (tag === 'I' || tag === 'EM') inline(n, { ...st, i: true }, out);
    else if (tag === 'CODE') inline(n, { ...st, code: true }, out);
    else if (tag === 'SPAN' && n.classList.contains('cf')) inline(n, { ...st, cf: true }, out);
    else if (tag === 'SPAN' && n.classList.contains('pill')) inline(n, { ...st, pill: /b3261e/i.test(n.getAttribute('style') || '') ? 'red' : 'navy' }, out);
    else inline(n, st, out);

}
function runsOf(el) {
  const out = []; inline(el, {}, out);
  for (let i = 0; i < out.length; i++) {
    const r = out[i]; if (r.t === undefined) continue;
    const prevBr = i === 0 || out[i - 1].br, nextBr = i === out.length - 1 || out[i + 1].br;
    if (prevBr) r.t = r.t.replace(/^\s+/, '');
    if (nextBr) r.t = r.t.replace(/\s+$/, '');
  }

}
const plain = runs => runs.map(r => r.br ? ' ' : r.t).join('').trim();
function olStart(el) {
  const m = /counter-reset:\s*n\s+(\d+)/.exec(el.getAttribute('style') || '');
  if (m) return +m[1] + 1;
  const s = el.getAttribute('start'); return s ? +s : 1;
}
function parseRow(el) {
  const cols = [];
  for (const c of el.querySelectorAll(':scope > .col')) {
    const cv = c.querySelector('canvas[data-screen]'), ph = c.querySelector('.ph');
    const cap = c.querySelector('.cap'), dev = c.querySelector('.dev');
    if (cv) cols.push({ screen: cv.getAttribute('data-screen'), cap: cap ? plain(runsOf(cap)) : '', size: dev && ['xs', 'sm', 'lg'].find(k => dev.classList.contains(k)) || '' });
    else if (ph) { const im = ph.querySelector('img'); const src = im ? im.getAttribute('src') : ''; const nm = (/box(\d)/.exec(src) || [])[1]; cols.push({ photo: src, label: 'Photo: Box ' + (nm || '?') }); }
  }

}
function parseTable(el) {
  const rows = [...el.querySelectorAll('tr')]; const head = [], body = [];
  rows.forEach(tr => { const cells = [...tr.children].map(runsOf); if (tr.querySelector('th')) head.push(...[cells]); else body.push(cells); });
  return { head: head[0] || null, rows: body };
}

// heading plan: level of each page title, optional parent heading (level 2, new page), optional page break before
const PLAN = {
  'Meet the machines': { l: 2 }, 'Before you start': { l: 2 },
  'Box 1 - Cleaner': { l: 2, pb: 1 }, 'Rate it and choose the mist': { l: 3 }, 'Pick the time and pay': { l: 3 }, 'Load your helmet': { l: 3 }, 'While it cleans': { l: 3 }, 'All done': { l: 3 },
  'Box 2 - Dryer': { l: 2, pb: 1 }, 'Heating and cooling': { l: 3 },
  'Box 3 - Cleaner + Dryer': { l: 2, pb: 1 }, 'DRYING mode': { l: 3 },
  'Prices and time': { l: 2, pb: 1 },
  'Special screens': { l: 3, parent: 'Special screens and safety' }, 'Safety first': { l: 3 }, 'Questions': { l: 3 },
  'Connecting': { l: 2, pb: 1 }, 'Home page': { l: 2 },
  'Rules and prices': { l: 3, parent: 'Box settings (rules, levels, phases)' }, 'Containers and sensors': { l: 3 }, 'Cleaning phases': { l: 3 }, 'Heating and drying': { l: 3 },
  'Screen (touch display)': { l: 3, parent: 'Screen refresh and maintenance' }, 'Maintenance mode': { l: 3 },
  'Refill station (ACS)': { l: 2, pb: 1 }, 'Setting up the ACS': { l: 3 }, 'Reading the ACS': { l: 3 }, 'Try it and fix it': { l: 3 },
  'Troubleshooting': { l: 3, parent: 'Troubleshooting and care' }, 'Care and spare parts': { l: 3 },
};

// ------------------------------------------------------------------ block renderers
const tocEntries = [];
function heading(text, lvl, pb) {
  if (lvl <= 2) tocEntries.push({ lvl, text });
  return P(T(text), { style: 'Heading' + lvl, pb });
}
function callout(kind, runs) {
  const tip = kind === 'tip', col = tip ? AMBER : 'B3261E', fill = tip ? 'FFF4D1' : 'FDE8E6';
  const b = `<w:top w:val="nil"/><w:left w:val="single" w:sz="36" w:space="0" w:color="${col}"/><w:bottom w:val="nil"/><w:right w:val="nil"/>`;
  return gap(60) + TBL([TW], TR(TC(TW, P(runsXml(runs), { style: 'Callout' }), { fill, borders: b, mar: MAR(100, 170, 100, 170), va: 'center' }))) + gap(120);
}
function dataTable(t, wAttr, boldFirst) {

    const fill = ri % 2 ? 'FFF8E1' : 'FFFFFF';

    rows += TR(r.map((c, i) => TC(widths[i], P(runsXml(c, boldFirst && i === 0 ? { b: true } : {}), { style: 'TableText' }), { fill, borders: bd })).join(''));

async function screenRow(cols) {

async function shot(src, m, alt) {

}

// an inline <svg> figure -> PNG (2x), registered like any other picture
async function svgToImg(svgEl) {
  const vb = svgEl.getAttribute('viewBox').trim().split(/\s+/).map(Number), W2 = vb[2] * 2, H2 = vb[3] * 2;
  let s = new XMLSerializer().serializeToString(svgEl);

  s = s.replace(/<svg([^>]*?)>/, (m, a) => '<svg' + a.replace(/\s(width|height)="[^"]*"/g, '') + ` width="${W2}" height="${H2}">`);
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('svg render failed')); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); });

  const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, W2, H2); g.drawImage(img, 0, 0, W2, H2);

}
async function figure(el) {

    const chart = el.classList.contains('chart');          // flowcharts and decision trees get a whole page
    return P(pic(img, docRels, chart ? 6.0 : 6.2, capText || 'figure', { border: 'D6DBE6', maxH: chart ? 7.2 : 5.4 }), { jc: 'center', before: 80, after: 0, keepNext: true }) + capXml;
  }
  const slot = el.querySelector('.ph');
  if (slot && !el.querySelector('img')) {                  // a Cirkit picture that has not been saved yet: a dashed box to paste it into

      P(T('Delete this text and use Insert, Pictures. (For the PDF the picture is saved as images\\cirkit\\' + (plain(runsOf(slot)).split('as images\\cirkit\\')[1] || '').split(',')[0] + '.)', { color: '6B7280', sz: 17 }), { jc: 'center', before: 0, after: 0 });

  }

  const loaded = [];
  for (const im of el.querySelectorAll('img')) loaded.push({ img: await loadImg(im.getAttribute('src')), alt: im.getAttribute('alt') || '' });

  if (loaded.length === 1) return P(pic(loaded[0].img, docRels, 6.2, loaded[0].alt || capText, { border: 'D6DBE6', maxH: el.classList.contains('cirkit') ? 7.0 : 5.2 }), { jc: 'center', before: 80, after: 0, keepNext: true }) + capXml;

  const cols = loaded.map((x, i) => Math.round(h * ar[i] * 1440) + (i < loaded.length - 1 ? Math.round(gapIn * 1440) : 0));

    const settingsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings ${W}><w:defaultTabStop w:val="720"/><w:characterSpacingControl w:val="doNotCompress"/><w:updateFields w:val="true"/><w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat></w:settings>`;
    const core = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>Jolly Helmet - User Manual</dc:title><dc:creator>MEJEZ STUDIO</dc:creator><cp:lastModifiedBy>MEJEZ STUDIO</cp:lastModifiedBy><dcterms:created xsi:type="dcterms:W3CDTF">2026-10-07T00:00:00Z</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">2026-10-10T00:00:00Z</dcterms:modified></cp:coreProperties>`;

    const RT = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/';
    const docRelsXml = relXml(docRels).replace('</Relationships>',
      `<Relationship Id="rIdSty" Type="${RT}styles" Target="styles.xml"/><Relationship Id="rIdNum" Type="${RT}numbering" Target="numbering.xml"/><Relationship Id="rIdSet" Type="${RT}settings" Target="settings.xml"/><Relationship Id="rIdHdr" Type="${RT}header" Target="header1.xml"/><Relationship Id="rIdFtr" Type="${RT}footer" Target="footer1.xml"/><Relationship Id="rIdHdrE" Type="${RT}header" Target="header2.xml"/><Relationship Id="rIdFtrE" Type="${RT}footer" Target="footer2.xml"/></Relationships>`);

    const parts = {

    };
    // every XML part must parse
    let bad = 0;
    for (const [k, v] of Object.entries(parts)) {
      const d = new DOMParser().parseFromString(v, 'application/xml');
      const err = d.querySelector('parsererror');
      if (err) { bad++; LOG('XML ERROR in ' + k + ': ' + err.textContent.slice(0, 300)); }
    }
    LOG('xml parts checked: ' + Object.keys(parts).length + ', errors: ' + bad);
    if (bad) return;

    const zip = new JSZip();
    for (const [k, v] of Object.entries(parts)) zip.file(k, v, { createFolders: false });
    for (const [k, v] of Object.entries(media)) zip.file('word/media/' + k, v, { createFolders: false });
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
    const res = await fetch('/save/' + (new URLSearchParams(location.search).get('out') || 'JollyHelmet_UserManual.docx'), { method: 'POST', body: blob });
    LOG('headings in contents: ' + tocEntries.length + ', numbered lists: ' + numOverrides.length + ', images: ' + Object.keys(media).length);
    LOG('docx: ' + blob.size + ' bytes -> ' + (await res.text()));
    LOG('DONE');
  } catch (e) { LOG('FAILED: ' + e.message + '\n' + e.stack); }

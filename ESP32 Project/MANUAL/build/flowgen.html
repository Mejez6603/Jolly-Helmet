<div id="bar">generating...</div><div id="out"></div>
<!--
  Draws the box flowcharts and the troubleshooting trees for the user manual as inline SVG (fig-flowNN / fig-treeNN), then posts them to
  /save/build/figs_ref.html (needs the manual helper server). The step names and branches come from the S3A / S3B / S3C firmware.
  Open it, wait for "saved", look at the pictures, adjust a spec below if a box overlaps.
-->
<script>
"use strict";
const COLX = [64, 210, 356];
const KIND = {
  start: { fill: '#14325c', stroke: '#14325c', text: '#ffffff' },
  end:   { fill: '#14325c', stroke: '#14325c', text: '#ffffff' },
  step:  { fill: '#ffffff', stroke: '#14325c', text: '#14325c' },
  run:   { fill: '#e2f3e7', stroke: '#1b7f3b', text: '#0f4d24' },
  err:   { fill: '#fde8e6', stroke: '#b3261e', text: '#7a1812' },
  dec:   { fill: '#fff1d0', stroke: '#f59e0b', text: '#5a3600' },
  note:  { fill: '#ffffff', stroke: '#6b7280', text: '#4b5563', dash: true },
  jump:  { fill: '#e1eefb', stroke: '#1c5fa8', text: '#14325c' },
  act:   { fill: '#e2f3e7', stroke: '#1b7f3b', text: '#0f4d24' }
};
/* BLACK AND WHITE (the default; add ?color to the address for the old coloured version): no colours at all. The kinds are told apart by shape and line instead:
   black rounded box = start / end, white box = a screen or step, THICK border = the machine is running (or, in the guides, "do this"),
   DOUBLE border = a fault (OUT OF ORDER), diamond = a decision, thin pill = the chart goes on elsewhere, dashed box = a note. */
const BW = !/[?&]color/.test(location.search);
if (BW) Object.assign(KIND, {
  start: { fill: '#000000', stroke: '#000000', text: '#ffffff' },
  end:   { fill: '#000000', stroke: '#000000', text: '#ffffff' },
  step:  { fill: '#ffffff', stroke: '#000000', text: '#000000' },
  run:   { fill: '#ffffff', stroke: '#000000', text: '#000000', sw: 3 },
  err:   { fill: '#ffffff', stroke: '#000000', text: '#000000', sw: 1.4, dbl: true },
  dec:   { fill: '#ffffff', stroke: '#000000', text: '#000000', sw: 1.4 },
  note:  { fill: '#ffffff', stroke: '#000000', text: '#000000', dash: true },
  jump:  { fill: '#ffffff', stroke: '#000000', text: '#000000' },
  act:   { fill: '#ffffff', stroke: '#000000', text: '#000000', sw: 2.8 }
});
const INK = BW ? '#000000' : '#1d2433', INK2 = BW ? '#000000' : '#14325c', FRAME = BW ? '#000000' : '#d6dbe6';
const WARN = [];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function layout(spec) {
  const gap = spec.gap == null ? 13 : spec.gap;
  const perRow = {};
  spec.nodes.forEach(n => { perRow[n.r] = (perRow[n.r] || 0) + 1; });
  spec.nodes.forEach(n => {
    n.lines = n.t.split('\n');
    const dec = n.k === 'dec', multi = n.lines.length > 1;
    n.h = n.h || (dec ? Math.max(48, 28 + n.lines.length * 13) : Math.max(28, 13 + n.lines.length * 10.5));
    if (n.k === 'jump') n.h = Math.max(24, 11 + n.lines.length * 10.5);
    // estimated text width (bold first line when there are several lines, or a single line) against what the shape can hold
    const est = (ln, bold) => ln.split('').reduce((a, ch) => a + (/[A-Z0-9@#%&]/.test(ch) ? (bold ? 5.9 : 5.3) : /[ ilj.,:;'!()\/|-]/.test(ch) ? (bold ? 2.7 : 2.3) : (bold ? 4.7 : 4.2)), 0);
    const need = Math.max.apply(null, n.lines.map((ln, i) => est(ln, i === 0 || !multi)));
    const dy = (n.lines.length - 1) * 5.25 + 5.5;
    const room = w => dec ? w * (1 - 2 * dy / n.h) - 4 : (n.k === 'jump' ? w - 26 : w - 10);
    if (!n.w) {
      n.w = dec ? 124 : (n.k === 'jump' ? 116 : 108);
      if (need > room(n.w) && ((n.c === 1 && perRow[n.r] === 1) || dec)) n.w = Math.min(dec && perRow[n.r] > 1 ? 150 : 176,Math.ceil(dec ? (need + 4) / (1 - 2 * dy / n.h) : need + (n.k === 'jump' ? 26 : 10)));
    }
    if (need > room(n.w)) WARN.push(spec.name + ' ' + n.id + ': "' + n.lines.reduce((a, b) => (b.length > a.length ? b : a), '') + '" (' + Math.round(need) + ' > ' + Math.round(room(n.w)) + ')');
  });
  const rowH = {};
  spec.nodes.forEach(n => { rowH[n.r] = Math.max(rowH[n.r] || 0, n.h); });
  const rows = Object.keys(rowH).map(Number).sort((a, b) => a - b);
  let y = 10; const rowY = {};
  rows.forEach(r => { rowY[r] = y + rowH[r] / 2; y += rowH[r] + gap; });
  spec.H = Math.round(y - gap + 10);
  spec.byId = {};
  spec.nodes.forEach(n => { n.x = COLX[0] + n.c * (COLX[1] - COLX[0]); n.y = rowY[n.r]; spec.byId[n.id] = n; });
}

function pt(n, side) {
  if (side === 't') return [n.x, n.y - n.h / 2];
  if (side === 'b') return [n.x, n.y + n.h / 2];
  if (side === 'l') return [n.x - n.w / 2, n.y];
  return [n.x + n.w / 2, n.y];
}
const DIR = { t: [0, -1], b: [0, 1], l: [-1, 0], r: [1, 0] };

function route(a, sa, b, sb) {
  const p0 = pt(a, sa), p1 = pt(b, sb), stub = 9;
  const d0 = DIR[sa], d1 = DIR[sb];
  const vert0 = sa === 't' || sa === 'b', vert1 = sb === 't' || sb === 'b';
  const pts = [p0];
  if (sa === sb) {                                   // a loop that leaves and re-enters on the same side
    if (vert0) { const Y = (sa === 'b' ? Math.max(p0[1], p1[1]) : Math.min(p0[1], p1[1])) + d0[1] * 14; pts.push([p0[0], Y], [p1[0], Y]); }
    else { const X = (sa === 'r' ? Math.max(p0[0], p1[0]) : Math.min(p0[0], p1[0])) + d0[0] * 14; pts.push([X, p0[1]], [X, p1[1]]); }
  } else if (vert0 && vert1) {                       // top/bottom to top/bottom
    if (Math.abs(p0[0] - p1[0]) < 0.5) { /* straight */ }
    else { const m = (p0[1] + p1[1]) / 2; pts.push([p0[0], m], [p1[0], m]); }
  } else if (!vert0 && !vert1) {                     // left/right to left/right
    if (Math.abs(p0[1] - p1[1]) < 0.5) { /* straight */ }
    else { const m = (p0[0] + p1[0]) / 2; pts.push([m, p0[1]], [m, p1[1]]); }
  } else if (vert0 && !vert1) { pts.push([p0[0], p1[1]]); }   // leaves vertically, enters horizontally
  else { pts.push([p1[0], p0[1]]); }                           // leaves horizontally, enters vertically
  pts.push(p1);
  return pts;
}

function render(spec) {
  layout(spec);
  let s = `<svg viewBox="0 0 420 ${spec.H}" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">`;
  s += `<defs><marker id="ah${spec.name}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${INK}"/></marker></defs>`;
  s += `<rect x="0" y="0" width="420" height="${spec.H}" rx="8" fill="#ffffff" stroke="${FRAME}"/>`;
  // edges first (under the boxes), their labels last (over everything)
  let labels = '';
  spec.edges.forEach(e => {
    const a = spec.byId[e.a], b = spec.byId[e.b], [sa, sb] = e.s.split('>');
    const pts = route(a, sa, b, sb);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const marker = e.noarrow ? '' : ` marker-end="url(#ah${spec.name})"` + (e.both ? ` marker-start="url(#ah${spec.name})"` : '');
    s += `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.3"${e.dash ? ' stroke-dasharray="3 3"' : ''}${marker}/>`;
    if (e.l) {
      const p0 = pts[0], p1 = pts[1], horiz = Math.abs(p1[1] - p0[1]) < 0.5;
      let lx, ly, anchor = 'middle';
      if (e.at) { lx = e.at[0]; ly = e.at[1]; }
      else if (horiz) { lx = (p0[0] + p1[0]) / 2; ly = p0[1] - 3.5; if (Math.abs(p1[0] - p0[0]) < 30) lx = p0[0] + (p1[0] > p0[0] ? 15 : -15); }
      else { lx = p0[0] + 4; ly = (p0[1] + Math.min(Math.max(p1[1], p0[1] - 22), p0[1] + 22)) / 2 + 3; anchor = 'start'; if (p1[1] < p0[1]) ly = p0[1] - 8; }
      labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" font-size="8" font-weight="700" fill="${INK2}" stroke="#ffffff" stroke-width="2.6" paint-order="stroke">${esc(e.l)}</text>`;
    }
  });
  // nodes
  spec.nodes.forEach(n => {
    const K = KIND[n.k] || KIND.step, x0 = n.x - n.w / 2, y0 = n.y - n.h / 2;
    if (n.k === 'dec') {
      s += `<path d="M${n.x} ${y0} L${x0 + n.w} ${n.y} L${n.x} ${y0 + n.h} L${x0} ${n.y} Z" fill="${K.fill}" stroke="${K.stroke}" stroke-width="${K.sw || 1.2}"/>`;
    } else {
      const rx = (n.k === 'start' || n.k === 'end' || n.k === 'jump') ? Math.min(n.h / 2, 14) : 6;
      s += `<rect x="${x0}" y="${y0}" width="${n.w}" height="${n.h}" rx="${rx}" fill="${K.fill}" stroke="${K.stroke}" stroke-width="${K.sw || 1.2}"${K.dash ? ' stroke-dasharray="3 3"' : ''}/>`;
      if (K.dbl) s += `<rect x="${x0 + 3}" y="${y0 + 3}" width="${n.w - 6}" height="${n.h - 6}" rx="${Math.max(2, rx - 3)}" fill="none" stroke="${K.stroke}" stroke-width="1.1"/>`;   // a second line inside: a fault
    }
    const ty = n.y - (n.lines.length - 1) * 5.25 + 3;
    n.lines.forEach((ln, i) => {
      s += `<text x="${n.x}" y="${(ty + i * 10.5).toFixed(1)}" text-anchor="middle" font-size="8.3" ${i === 0 && n.lines.length > 1 ? 'font-weight="700"' : (n.lines.length === 1 ? 'font-weight="700"' : '')} fill="${K.text}">${esc(ln)}</text>`;
    });
  });
  return s + labels + '</svg>';
}

(async () => {
  const out = document.getElementById('out'); let fig = '';
  SPECS.forEach(sp => {
    const svg = render(sp);
    out.insertAdjacentHTML('beforeend', `<div class="f" id="fig-${sp.name}">${svg}</div>`);
    fig += `<div class="f" id="fig-${sp.name}">\n${svg}\n</div>\n\n`;
  });
  const html = '<!doctype html>\n<html><head><meta charset="utf-8"><title>Reference figures</title></head><body>\n<!-- GENERATED by flowgen.html. Do not edit by hand. -->\n' + fig + '</body></html>\n';
  // the decision trees again, as data for the online page's "Fix it" wizard (ONLINE_WEB/js/wizard_data.js; copy it there)
  const trees = SPECS.filter(sp => /^tree/.test(sp.name)).map(sp => {
    const clean = t => t.replace(/\s*\n\s*/g, ' ').trim();
    const nodes = {}; sp.nodes.forEach(n => { nodes[n.id] = { k: n.k, t: clean(n.t) }; });
    return { id: sp.name, title: nodes.S.t, nodes, edges: sp.edges.filter(e => !e.noarrow).map(e => ({ a: e.a, b: e.b, l: e.l || '' })) };
  });
  const wiz = '"use strict";\n/* GENERATED from MANUAL\\build\\flowgen.html (the same decision trees as the manual). Do not edit by hand. */\nconst WIZARD_TREES = ' + JSON.stringify(trees, null, 1) + ';\n';
  try { await fetch('/save/build/wizard_data.js', { method: 'POST', body: wiz }); } catch (e) {}
  try {
    const r = await fetch('/save/build/figs_ref.html', { method: 'POST', body: html });
    document.getElementById('bar').textContent = 'figures: ' + SPECS.length + ' | ' + (await r.text()) + ' | text warnings: ' + WARN.length + (WARN.length ? ' | ' + WARN.join(' ;; ') : '');
  } catch (e) { document.getElementById('bar').textContent = 'not saved: ' + e.message; }
})();
